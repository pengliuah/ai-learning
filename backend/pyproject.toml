[project]
name = "zhixue-backend"
version = "0.1.0"
description = "AI learning agent backend (FastAPI + LangChain DeepAgents)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "deepagents>=0.5",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
]