# ============================================================================
# zhixue 线上环境编排 (HTTPS, 域名 + 证书)
#
# 与 docker-compose.test.yml 的区别仅在于 nginx:
#   - prod: 80 跳 443, 443 SSL (证书挂载 ./nginx/ssl, 见 nginx/zhixue.conf)
#   - test: 纯 HTTP 80, 无证书
#
# 密钥/配置从项目根目录 `.env` 读取 (docker compose 自动加载, 见 deploy.env.example):
#   POSTGRES_PASSWORD / JWT_SECRET / ADMIN_USERNAME / ADMIN_PASSWORD
#
# 用法:
#   sudo bash scripts/deploy.sh prod
#   # 或手动: docker compose -f docker-compose.prod.yml build && \
#   #         docker compose -f docker-compose.prod.yml up -d
# ============================================================================
services:
  zhixue:
    build: .
    # Nginx 反向代理访问; 不直接暴露到宿主机
    expose:
      - "8000"
    volumes:
      - ./backend/data:/app/backend/data
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-123}@postgres:5432/zhixue
      # 账号系统: JWT 签名密钥与首次引导管理员 (模型 API Key 不在这里,
      # 每个用户登录后在网页「模型设置」页配置, 存数据库)
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zhixue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/zhixue.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - zhixue
    restart: unless-stopped

volumes:
  pgdata:
