services:
  zhixue:
    build: .
    # Nginx 反向代理访问; 不再直接暴露到宿主机
    expose:
      - "8000"
    volumes:
      - ./backend/data:/app/backend/data
    environment:
      - ARK_API_KEY=                    # ← 填入火山方舟 API Key
      - ARK_MODEL=doubao-1.5-pro-32k
      - ARK_BASE_URL=https://ark.cn-beijing.volces.com/api/v3
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/zhixue
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zhixue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/zhixue.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - zhixue
    restart: unless-stopped

volumes:
  pgdata:
