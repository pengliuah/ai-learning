# ============================================================
# zhixue Nginx HTTPS 配置 (Docker Compose 内运行)
#
# 本文件由 docker-compose.yml 挂载到 nginx 容器内:
#   ./nginx/zhixue.conf -> /etc/nginx/conf.d/zhixue.conf
#   ./nginx/ssl/        -> /etc/nginx/ssl/
#
# 部署前:
#   1. 阿里云 SSL 证书控制台 -> 下载 (选 Nginx 格式) -> 得到 .pem + .key
#   2. 放到服务器 /opt/zhixue/nginx/ssl/ 下, 命名为 zhixue.pem 和 zhixue.key
#   3. 把下方两处 server_name your-domain.com 改成你的实际域名
#   4. 阿里云安全组放行 443 和 80 端口
#   5. sudo bash scripts/deploy.sh
# ============================================================

# HTTP -> HTTPS 301 跳转
server {
    listen 80;
    server_name your-domain.com;          # ← 改成你的域名

    return 301 https://$host$request_uri;
}

# HTTPS 主站
server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com;          # ← 改成你的域名

    # --- SSL 证书 (阿里云下载的 Nginx 格式) ---
    ssl_certificate     /etc/nginx/ssl/zhixue.pem;
    ssl_certificate_key /etc/nginx/ssl/zhixue.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --- API (含 SSE 流式生成内容) ---
    location /api/ {
        proxy_pass http://zhixue:8000;       # ← Docker 容器端口
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # SSE: 关闭缓冲, 延长超时, 否则流式内容会被 Nginx 缓存住
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # --- 前端页面 + 静态资源 (FastAPI 统一服务) ---
    location / {
        proxy_pass http://zhixue:8000;       # ← Docker 容器端口
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }
}
