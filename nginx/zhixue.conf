# ============================================================
# zhixue Nginx HTTP 配置 (测试环境, Docker Compose 内运行)
#
# 测试环境: 不启用 SSL, 直接用 IP 访问。
# 本文件由 docker-compose.yml 挂载到 nginx 容器内:
#   ./nginx/zhixue.conf -> /etc/nginx/conf.d/zhixue.conf
#
# 部署:
#   1. sudo bash scripts/deploy.sh
#   2. 浏览器访问 http://<服务器IP>/
# ============================================================

# HTTP 主站 (测试环境: 无 SSL, 直接 IP 访问)
server {
    listen 80;
    server_name _;                          # 接受任意域名/IP

    # --- API (含 SSE 流式生成内容) ---
    location /api/ {
        proxy_pass http://zhixue:8000;       # Docker 容器端口
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # SSE: 关闭缓冲, 延长超时, 否则流式内容会被 Nginx 缓存住
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # --- 前端页面 + 静态资源 (FastAPI 统一服务) ---
    location / {
        proxy_pass http://zhixue:8000;       # Docker 容器端口
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }
}
