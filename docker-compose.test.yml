# ============================================================================
# zhixue 测试环境编排 (纯 HTTP, 无域名无证书, 用服务器 IP 直接访问)
#
# 与 docker-compose.prod.yml 的区别仅在于 nginx:
#   - test: 纯 HTTP 80 (见 nginx/zhixue-test.conf), 不挂载证书目录
#   - prod: 80 跳 443 + SSL
#
# 密钥/配置从项目根目录 `.env` 读取 (docker compose 自动加载, 见 deploy.env.example)。
#
# 用法:
#   sudo bash scripts/deploy.sh test
#   # 或手动: docker compose -f docker-compose.test.yml build && \
#   #         docker compose -f docker-compose.test.yml up -d
#
# 访问: http://<服务器IP>/
# ============================================================================
services:
  zhixue:
    build: .
    expose:
      - "8000"
    volumes:
      - ./backend/data:/app/backend/data
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-123}@postgres:5432/zhixue
      # 账号系统: JWT 签名密钥与首次引导管理员 (模型 API Key 不在这里,
      # 每个用户登录后在网页「模型设置」页配置, 存数据库)
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    # 测试环境: 对外暴露 5432, 供本地开发/调试直连测试库
    # (线上环境 docker-compose.prod.yml 不暴露, 数据库只在 docker 内网)
    ports:
      - "${POSTGRES_EXPOSE_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: zhixue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    volumes:
      # 数据落在宿主机 ./pgdata (gitignore 外部数据), 命名卷可能被
      # docker volume prune / 项目名变化弄丢, 目录看得见最稳
      - ./pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/zhixue-test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - zhixue
    restart: unless-stopped
