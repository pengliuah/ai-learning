# ============================================================
# zhixue Nginx 配置 — 测试环境 (纯 HTTP, 无域名无证书)
#
# 用 IP 直接访问: http://<服务器IP>/
# 线上环境 (HTTPS + 域名) 见 nginx/zhixue.conf。
#
# 由 docker-compose.test.yml 挂载到 /etc/nginx/conf.d/default.conf。
# ============================================================

server {
    listen 80 default_server;
    server_name _;

    # Docker 内置 DNS。nginx 对静态 proxy_pass 只在启动时解析一次容器名,
    # 后端容器重建后 IP 变了会一直 502 (Connection refused);
    # 用变量 + resolver 让 nginx 每次请求前重新解析, 跟随容器 IP 变化。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- API (含 SSE 流式生成内容) ---
    # 附件上传 (学习资料文件, 单文件 <=50MB): 默认 1m 会被 413 拒掉
    client_max_body_size 55m;

    location /api/ {
        set $zhixue_upstream zhixue:8000;
        proxy_pass http://$zhixue_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: 关闭缓冲, 延长超时, 否则流式内容会被 Nginx 缓存住
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # --- 前端页面 + 静态资源 (FastAPI 统一服务) ---
    location / {
        set $zhixue_upstream zhixue:8000;
        proxy_pass http://$zhixue_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
