# ============================================================
# zhixue Nginx 配置 (HTTPS, Docker Compose 内运行)
#
# 证书: 把阿里云下载的 Nginx 证书放到 ./nginx/ssl/ 并命名为:
#   www.ailearningagent.xyz.pem   (证书, fullchain)
#   www.ailearningagent.xyz.key   (私钥)
# docker-compose 把 ./nginx/ssl 挂载到 /etc/nginx/ssl (只读)。
#
# - 80  : 全部 301 跳转到 HTTPS
# - 443 : SSL 主站, /api 反代后端 (SSE 关缓冲), / 反代前端 SPA
# ============================================================

# ---------- HTTP -> HTTPS ----------
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---------- HTTPS 主站 ----------
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/www.ailearningagent.xyz.pem;
    ssl_certificate_key /etc/nginx/ssl/www.ailearningagent.xyz.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    # Docker 内置 DNS。nginx 对静态 proxy_pass 只在启动时解析一次容器名,
    # 后端容器重建后 IP 变了会一直 502 (Connection refused);
    # 用变量 + resolver 让 nginx 每次请求前重新解析, 跟随容器 IP 变化。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- API (含 SSE 流式生成内容) ---
    # 附件上传 (学习资料文件, 单文件 <=50MB): 默认 1m 会被 413 拒掉
    client_max_body_size 55m;

    location /api/ {
        set $zhixue_upstream zhixue:8000;
        proxy_pass http://$zhixue_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: 关闭缓冲, 延长超时, 否则流式内容会被 Nginx 缓存住
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # --- 前端页面 + 静态资源 (FastAPI 统一服务) ---
    location / {
        set $zhixue_upstream zhixue:8000;
        proxy_pass http://$zhixue_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}