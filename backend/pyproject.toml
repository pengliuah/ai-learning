[project]
name = "zhixue-backend"
version = "0.1.0"
description = "AI learning agent backend (FastAPI + LangChain DeepAgents)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "deepagents>=0.5",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "psycopg[binary,pool]>=3.2",
    "bcrypt>=4.0",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "mem0ai==2.0.20",
    # 学习资料转写: PDF 渲染 / docx 抽文本 / 大图片压缩; multipart 上传
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

