# ============================================================
# zhixue Nginx 配置 — 测试环境 (纯 HTTP, 无域名无证书)
#
# 用 IP 直接访问: http://<服务器IP>/
# 线上环境 (HTTPS + 域名) 见 nginx/zhixue.conf。
#
# 由 docker-compose.test.yml 挂载到 /etc/nginx/conf.d/default.conf。
# ============================================================

server {
    listen 80 default_server;
    server_name _;

    # --- API (含 SSE 流式生成内容) ---
    location /api/ {
        proxy_pass http://zhixue:8000;       # Docker Compose 服务名
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: 关闭缓冲, 延长超时, 否则流式内容会被 Nginx 缓存住
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # --- 前端页面 + 静态资源 (FastAPI 统一服务) ---
    location / {
        proxy_pass http://zhixue:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
